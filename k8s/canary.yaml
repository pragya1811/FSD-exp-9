apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-api-canary
  namespace: pipeline-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pipeline-api
      track: canary
  template:
    metadata:
      labels:
        app: pipeline-api
        track: canary
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-owner/replace-repo-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RELEASE_VERSION
              value: canary
          envFrom:
            - secretRef:
                name: pipeline-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
