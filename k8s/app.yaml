apiVersion: v1
kind: Namespace
metadata:
  name: pipeline-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-api-stable
  namespace: pipeline-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pipeline-api
      track: stable
  template:
    metadata:
      labels:
        app: pipeline-api
        track: stable
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-owner/replace-repo-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RELEASE_VERSION
              value: stable
          envFrom:
            - secretRef:
                name: pipeline-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-web
  namespace: pipeline-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-web
  template:
    metadata:
      labels:
        app: pipeline-web
    spec:
      containers:
        - name: web
          image: ghcr.io/replace-owner/replace-repo-web:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-api
  namespace: pipeline-lab
spec:
  selector:
    app: pipeline-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-web
  namespace: pipeline-lab
spec:
  selector:
    app: pipeline-web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-web
  namespace: pipeline-lab
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeline-web
                port:
                  number: 80
